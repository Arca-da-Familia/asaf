name: Tarefa Mensal (cobrança do mês + contas a pagar recorrentes)

# v3.2.1 (adaptado, 2026-09-17) - substitui Pix Automático (Resolução BCB 402/506, exige convênio
# pago com banco/PSP, sem orçamento hoje - achado confirmado com o usuário): gera a cobrança do
# mês corrente e envia lembrete por e-mail (Pix pronto) de quem está prestes a vencer ou vence
# hoje, todo dia 1 do mês. Roda como SISTEMA, direto contra o banco (mesmo mecanismo de
# confiança que já roda migração Alembic em produção via DATABASE_URL do Key Vault) - nenhum
# login humano é necessário. v6.2d: os lembretes saem todo dia, na tarefa-diaria-lembretes.yml;
# aqui ficou a cobrança e as contas a pagar recorrentes (por isso não busca mais o SMTP).
on:
  schedule:
    - cron: "0 9 1 * *" # dia 1 de cada mês, 09:00 UTC (06:00 em Brasília)
  workflow_dispatch: {}

permissions:
  id-token: write # necessário para login OIDC no Azure (sem senha salva)
  contents: read

jobs:
  tarefa-mensal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Login no Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Buscar DATABASE_URL do Key Vault
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          # v7.3d: a senha também SOZINHA (e como fica depois de decodificada) - o mascaramento só pega o texto exato, e uma mensagem de erro pode trazer
          # só a senha. O registro seguro (app/registro_seguro.py) tira a mensagem dos erros: os registros deste repositório são públicos.
          DB_SENHA=$(python3 -c "from urllib.parse import urlsplit, unquote; import sys; s = urlsplit(sys.argv[1]).password or ''; print(s); print(unquote(s))" "$DB_URL")
          while IFS= read -r PARTE; do if [ -n "$PARTE" ]; then echo "::add-mask::$PARTE"; fi; done <<< "$DB_SENHA"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "ASAF_REGISTRO_SEGURO=1" >> "$GITHUB_ENV"

      - name: Rodar tarefa mensal (gerar cobrança + contas a pagar recorrentes)
        # PYTHONPATH=. necessário pra `from app...` resolver - rodar o script direto (sem `-m`)
        # não coloca a raiz do repo no sys.path (mesmo motivo do `python -m pytest` em deploy-api.yml).
        run: PYTHONPATH=. python scripts/tarefa_mensal_financeiro.py

      - name: Logout
        if: always()
        run: az logout || true
