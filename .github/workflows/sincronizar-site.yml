name: Sincronizar site com o sistema

# O site é estático: Diretoria, Projetos, cada Evento, cada edital e cada NOTÍCIA viram PÁGINA no build.
# Quando algo muda no sistema (evento publicado, projeto novo, posse de dirigente, edital emitido) ou no
# Directus (notícia publicada ou editada) o site publicado fica para trás. Este workflow, a cada 15
# minutos, compara a "impressão digital" do conteúdo público (API do sistema + notícias do Directus)
# com a do site no ar (`/conteudo.json`) e, SÓ SE mudou, republica o site.
#
# Para disparar a republicação usa o GITHUB_TOKEN do próprio workflow, com a permissão mínima
# "actions: write" (disparar workflow; não lê nem altera código). Para LER as notícias do Directus
# faz login no Azure por OIDC (sem senha guardada) e busca o token da conta de serviço do site no Key
# Vault - uma conta que só lê o que está PUBLICADO e não escreve nada. A republicação vai pelo mesmo
# `deploy-site.yml` (disparo manual: pula os portões de qualidade, de propósito — publicar conteúdo
# já cadastrado no sistema não deve ficar preso numa rodada instável do Lighthouse).
#
# Vagas livres de evento NÃO entram na comparação (mudam a cada inscrição e fariam o site ser
# reconstruído sem parar): elas são atualizadas no navegador do visitante (src/lib/evento-vivo.ts).
on:
  schedule:
    - cron: "*/15 * * * *" # a cada 15 minutos
  workflow_dispatch: {}

permissions:
  actions: write # disparar o deploy-site.yml e guardar o instante da defasagem (cache)
  contents: read
  id-token: write # login OIDC no Azure (ler o token do Directus no Key Vault)
  issues: write # abrir/fechar o aviso de site defasado por mais de 2 horas

concurrency:
  group: sincronizar-site
  cancel-in-progress: false

env:
  PUBLIC_API_URL: https://api.asaf.org.br
  SITE_URL: https://asaf.org.br
  KEY_VAULT: kv-asaf-arca
  DIRECTUS_TOKEN_SECRET: DIRECTUS-SITE-TOKEN

jobs:
  sincronizar:
    name: Compara o conteúdo e, se mudou, republica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (só os scripts do site)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            site/scripts
            site/package.json
            site/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json

      # A comparação usa o MESMO código do build (limpeza do texto das notícias etc.), que precisa de
      # `sanitize-html`: instala só as dependências de produção, sem scripts de instalação.
      - name: Instala as dependências de produção do site
        working-directory: site
        run: npm ci --omit=dev --ignore-scripts

      - name: Login no Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Busca o token da conta de serviço do Directus no Key Vault
        run: |
          TOKEN=$(az keyvault secret show \
            --vault-name "$KEY_VAULT" \
            --name "$DIRECTUS_TOKEN_SECRET" \
            --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "DIRECTUS_SITE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Compara o conteúdo (sistema + Directus) com o do site publicado
        id: conteudo
        env:
          # Sem o token a comparação FALHA (fica vermelha e tenta de novo): nunca conclui "nada mudou"
          # por não ter conseguido ler as notícias.
          DIRECTUS_OBRIGATORIO: "1"
        run: node site/scripts/verificar-conteudo.mjs

      - name: Republica o site (só se o conteúdo mudou e não há publicação em andamento)
        if: steps.conteudo.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EM_ANDAMENTO=$(gh run list --workflow deploy-site.yml --repo "$GITHUB_REPOSITORY" \
            --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "$EM_ANDAMENTO" -gt 0 ]; then
            echo "Já há uma publicação do site em andamento ($EM_ANDAMENTO): a próxima rodada confere de novo."
            exit 0
          fi
          # Proteção contra laço de falha: se as 3 últimas publicações falharam, republicar de novo a cada 15
          # minutos só repete o erro (e enche o painel de execuções vermelhas). Para e AVISA (esta execução
          # fica vermelha); depois de corrigir a causa, "Run workflow" no deploy-site retoma o ciclo.
          FALHAS=$(gh run list --workflow deploy-site.yml --repo "$GITHUB_REPOSITORY" --limit 3             --json conclusion -q '[.[] | select(.conclusion=="failure")] | length')
          if [ "$FALHAS" -ge 3 ]; then
            echo "::error::As 3 últimas publicações do site falharam: NÃO vou tentar de novo sozinho. Veja o erro em Actions > Deploy Site, corrija e rode o deploy-site à mão."
            exit 1
          fi
          gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Conteúdo mudou: publicação do site disparada."

      # ---- Alerta de DEFASAGEM (v5.4b): "o site no ar está atrás do sistema há mais de 2 horas".
      # A execução do workflow não tem memória; o instante em que a diferença apareceu fica num cache pequeno (um arquivo).
      # Diferença que dura 15-25 min é o ciclo normal (sincronização + publicação); mais de 2 h é problema de verdade
      # (publicação falhando, Static Web App fora do ar...). Nesse caso esta execução fica VERMELHA e abre um aviso.
      - name: Restaura desde quando o site está desatualizado
        uses: actions/cache/restore@v6
        with:
          path: defasagem
          key: defasagem-sem-chave-exata # só o prefixo abaixo importa: pega o registro mais recente
          restore-keys: defasagem-

      - name: Mede há quanto tempo o site está desatualizado
        id: defasagem
        env:
          MUDOU: ${{ steps.conteudo.outputs.mudou }}
          LIMITE_MINUTOS: "120"
        run: |
          mkdir -p defasagem
          AGORA=$(date -u +%s)
          DESDE=""
          [ -f defasagem/desde ] && DESDE=$(tr -d '[:space:]' < defasagem/desde)
          if [ "$MUDOU" = "true" ]; then
            if [ -z "$DESDE" ]; then
              DESDE=$AGORA
              echo "$DESDE" > defasagem/desde
              echo "mudar_registro=true" >> "$GITHUB_OUTPUT"
            fi
            MINUTOS=$(( (AGORA - DESDE) / 60 ))
            echo "O site no ar está atrás do sistema há ${MINUTOS} min (limite: ${LIMITE_MINUTOS})."
            echo "minutos=$MINUTOS" >> "$GITHUB_OUTPUT"
            if [ "$MINUTOS" -gt "$LIMITE_MINUTOS" ]; then echo "defasado=true" >> "$GITHUB_OUTPUT"; fi
          elif [ -n "$DESDE" ]; then
            : > defasagem/desde   # o site alcançou o sistema: zera o registro
            echo "mudar_registro=true" >> "$GITHUB_OUTPUT"
            echo "O site voltou a bater com o sistema."
          fi

      - name: Guarda o registro (só quando ele muda)
        if: steps.defasagem.outputs.mudar_registro == 'true'
        uses: actions/cache/save@v6
        with:
          path: defasagem
          key: defasagem-${{ github.run_id }}

      - name: Aviso no GitHub — site atrás do sistema há mais de 2 horas
        if: steps.defasagem.outputs.defasado == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTOS: ${{ steps.defasagem.outputs.minutos }}
        run: |
          ROTULO=alerta-site-defasado
          gh label create "$ROTULO" --repo "$GITHUB_REPOSITORY" --color D93F0B --description "O site no ar está atrás do sistema há mais de 2 horas (aviso automático)" 2>/dev/null || true
          ABERTO=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ROTULO" --state open --json number -q '.[0].number // ""')
          CORPO=$(printf 'O site publicado está atrás do sistema há %s minutos (limite: 120).\n\nO normal é a diferença durar uns 20 minutos (a sincronização confere de 15 em 15 e a publicação leva uns 5). Mais que isso quer dizer que a publicação está falhando ou o site está fora do ar.\n\nVeja Actions > Deploy Site: %s/%s/actions/workflows/deploy-site.yml\n\nEste aviso fecha sozinho quando o site alcançar o sistema.' \
            "$MINUTOS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY")
          if [ -n "$ABERTO" ]; then
            gh issue comment "$ABERTO" --repo "$GITHUB_REPOSITORY" --body "$CORPO"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$ROTULO" --title "ALERTA: o site está atrás do sistema há mais de 2 horas" --body "$CORPO"
          fi
          echo "::error::O site no ar está atrás do sistema há ${MINUTOS} minutos (mais de 2 horas)."
          exit 1

      - name: Fecha o aviso de defasagem quando o site alcançou o sistema
        if: steps.conteudo.outputs.mudou == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list --repo "$GITHUB_REPOSITORY" --label alerta-site-defasado --state open --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" --comment "O site voltou a bater com o sistema. Fechado automaticamente."
          done
