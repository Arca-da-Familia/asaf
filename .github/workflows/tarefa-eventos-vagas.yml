name: Tarefa Periódica (expira promoções de lista de espera vencidas)

# v4.7 (FASE 4) - quem foi promovido da lista de espera de um evento tem um prazo pra confirmar
# (PRAZO_CONFIRMACAO_LISTA_ESPERA_HORAS, configurável) antes de perder a vaga pro próximo da
# fila - alguém precisa checar isso periodicamente, senão a promoção "automática" nunca
# aconteceria de fato em produção. Roda como SISTEMA, mesmo mecanismo de confiança que já roda
# migração Alembic e a tarefa mensal financeira em produção.
on:
  schedule:
    - cron: "*/15 * * * *" # a cada 15 minutos
  workflow_dispatch: {}

permissions:
  id-token: write # necessário para login OIDC no Azure (sem senha salva)
  contents: read

# v6.2a - uma rodada por vez (a agendada atrasada, ou um disparo à mão, espera a anterior terminar; nenhuma é cancelada no meio): junto com a troca condicional
# Na fila -> Enviando no banco, é o que impede o e-mail de um aviso de sair em dobro.
concurrency:
  group: tarefa-periodica-de-15-minutos
  cancel-in-progress: false

jobs:
  expirar-promocoes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Login no Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Buscar segredos do Key Vault (DATABASE_URL + SMTP)
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          # v7.3d: a senha também SOZINHA (e como fica depois de decodificada) - o mascaramento só pega o texto exato, e uma mensagem de erro pode trazer
          # só a senha. O registro seguro (app/registro_seguro.py) tira a mensagem dos erros: os registros deste repositório são públicos.
          DB_SENHA=$(python3 -c "from urllib.parse import urlsplit, unquote; import sys; s = urlsplit(sys.argv[1]).password or ''; print(s); print(unquote(s))" "$DB_URL")
          while IFS= read -r PARTE; do if [ -n "$PARTE" ]; then echo "::add-mask::$PARTE"; fi; done <<< "$DB_SENHA"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "ASAF_REGISTRO_SEGURO=1" >> "$GITHUB_ENV"

          SMTP_HOST=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-HOST --query value -o tsv)
          SMTP_PORTA=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-PORTA --query value -o tsv)
          SMTP_USUARIO=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-USUARIO --query value -o tsv)
          SMTP_SENHA=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-SENHA --query value -o tsv)
          SMTP_REMETENTE=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-REMETENTE --query value -o tsv)
          echo "::add-mask::$SMTP_HOST"
          echo "::add-mask::$SMTP_PORTA"
          echo "::add-mask::$SMTP_USUARIO"
          echo "::add-mask::$SMTP_SENHA"
          echo "::add-mask::$SMTP_REMETENTE"
          echo "SMTP_HOST=$SMTP_HOST" >> "$GITHUB_ENV"
          echo "SMTP_PORTA=$SMTP_PORTA" >> "$GITHUB_ENV"
          echo "SMTP_USUARIO=$SMTP_USUARIO" >> "$GITHUB_ENV"
          echo "SMTP_SENHA=$SMTP_SENHA" >> "$GITHUB_ENV"
          echo "SMTP_REMETENTE=$SMTP_REMETENTE" >> "$GITHUB_ENV"

      - name: Rodar expiração de promoções de lista de espera vencidas
        run: PYTHONPATH=. python scripts/expirar_promocoes_vagas.py

      # v5.5a - o prazo de resposta da fila de atendimento é acompanhado de verdade: quem atende é avisado no sino dos pedidos vencidos ou perto de vencer
      # (uma vez por dia por pedido). O passo roda mesmo se o de cima falhar, e a falha dele não derruba a expiração das promoções.
      - name: Avisar os prazos da fila de atendimento
        if: always()
        run: PYTHONPATH=. python scripts/avisar_prazos_de_atendimento.py

      # v5.7d - a foto de quem ficou sem mandato vigente nem marcado é apagada sozinha (decisão do Presidente: "a foto da diretoria tem que apagar automaticamente; não pode ficar guardada"). Usa a conta
      # de armazenamento privada pela identidade do GitHub, que na PRODUÇÃO só tem papel de dados no contêiner `fotos-diretoria` (na homologação, na conta inteira). Se alguma foto não puder ser apagada o passo FALHA (sai com 1): foi
      # assim que se achou que o papel tinha sido criado para o identificador errado. Sem foto para apagar, nem toca no armazenamento.
      - name: Apagar a foto da Diretoria de quem ficou sem mandato
        if: always()
        env:
          ARMAZENAMENTO_BLOB_URL: https://stasafprivado.blob.core.windows.net
        run: PYTHONPATH=. python scripts/apagar_fotos_da_diretoria_vencidas.py
      # v5.6a - a doação feita pelo site (Pix) que a tesouraria não confirmou no prazo passa para "Prazo vencido sem confirmação"; segue podendo ser confirmada. Mesma regra
      # dos passos de cima: roda mesmo se um falhar, e a falha dele não derruba os outros.
      - name: Expirar as doações do site sem confirmação no prazo
        if: always()
        run: PYTHONPATH=. python scripts/expirar_intencoes_de_doacao.py

      # v5.7b - os PRAZOS DE GUARDA de dado pessoal (LGPD, arts. 15 e 16; Tabela de temporalidade do PLANO_PROJETO.md) são aplicados aqui: apaga ou anonimiza só o que JÁ passou do prazo de cada regra
      # (Configurações > Regras do sistema). Cada regra tem a sua transação; se alguma falhar o passo FALHA (sai com 1), em vez de deixar o dado guardado sem ninguém saber.
      #  O associado desligado perde também o ARQUIVO da foto (contêiner `fotos-associados`, onde a identidade do GitHub tem papel de dados só nesse contêiner e no `fotos-diretoria`).
      - name: Aplicar os prazos de guarda de dados pessoais
        if: always()
        env:
          ARMAZENAMENTO_BLOB_URL: https://stasafprivado.blob.core.windows.net
        run: PYTHONPATH=. python scripts/aplicar_retencao_de_dados.py

      # v6.2d - quem estava "Em Experiência" e cujo período acabou tem a situação recalculada; quem cuida de Associados é avisado no sino (uma vez por pessoa).
      - name: Avisar o fim do período de experiência
        if: always()
        run: PYTHONPATH=. python scripts/avisar_fim_de_experiencia.py

      # v6.2c - os avisos agendados cuja hora já passou são publicados (antes do passo do e-mail, para o e-mail deles sair na mesma rodada). Agendamento que não pode mais sair é
      # cancelado com o motivo; o passo só FALHA (sai com 1) se um agendamento der erro inesperado.
      - name: Publicar os avisos agendados
        if: always()
        run: PYTHONPATH=. python scripts/publicar_avisos_agendados.py

      # v6.2a - os avisos do mural marcados "também por e-mail" saem em lotes (teto por rodada e por dia, em Configurações > Regras do sistema; a conta do Google envia até 2.000 por dia).
      # Recusa de um endereço fica registrada no aviso e não derruba o passo; ele FALHA (sai com 1) se não conseguir conectar ao servidor de e-mail ou se o servidor recusar o remetente.
      - name: Enviar por e-mail os avisos do mural
        if: always()
        run: PYTHONPATH=. python scripts/enviar_emails_de_avisos.py

      - name: Logout
        if: always()
        run: az logout || true
