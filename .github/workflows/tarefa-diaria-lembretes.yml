name: Tarefa Diária (lembretes de mensalidade por e-mail)

# v6.2d (FASE 6) - os lembretes de mensalidade (Pix pronto) saem TODO DIA às 09:00 de Belém: antes do vencimento, no dia e depois
# (ver app/services/lembretes.py). Até a v6.2c rodavam só no dia 1, junto com a cobrança, e o "5 dias antes" só pegava quem vencia no
# dia 6. Uma rodada perdida é recuperada na seguinte (tolerância de 2 dias) e cada lembrete sai uma vez por título. Roda como SISTEMA,
# direto contra o banco (mesmo mecanismo de confiança das demais tarefas). O passo FALHA (sai com 1) se a rodada parar por falha da
# conta ou da conexão de e-mail; recusa de um endereço não derruba o lote.
on:
  schedule:
    - cron: "0 12 * * *" # todo dia, 12:00 UTC = 09:00 em Belém (a cobrança do mês sai às 09:00 UTC do dia 1, antes)
  workflow_dispatch: {}

permissions:
  id-token: write # necessário para login OIDC no Azure (sem senha salva)
  contents: read

# duas rodadas ao mesmo tempo (agendada + manual) nunca: a trava por título já impede repetir, mas não há por que disputar
concurrency:
  group: tarefa-diaria-lembretes
  cancel-in-progress: false

jobs:
  lembretes-de-mensalidade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Login no Azure via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Buscar segredos do Key Vault (DATABASE_URL + SMTP)
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          # v7.3d: a senha também SOZINHA (e como fica depois de decodificada) - o mascaramento só pega o texto exato, e uma mensagem de erro pode trazer
          # só a senha. O registro seguro (app/registro_seguro.py) tira a mensagem dos erros: os registros deste repositório são públicos.
          DB_SENHA=$(python3 -c "from urllib.parse import urlsplit, unquote; import sys; s = urlsplit(sys.argv[1]).password or ''; print(s); print(unquote(s))" "$DB_URL")
          while IFS= read -r PARTE; do if [ -n "$PARTE" ]; then echo "::add-mask::$PARTE"; fi; done <<< "$DB_SENHA"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "ASAF_REGISTRO_SEGURO=1" >> "$GITHUB_ENV"

          SMTP_HOST=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-HOST --query value -o tsv)
          SMTP_PORTA=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-PORTA --query value -o tsv)
          SMTP_USUARIO=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-USUARIO --query value -o tsv)
          SMTP_SENHA=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-SENHA --query value -o tsv)
          SMTP_REMETENTE=$(az keyvault secret show --vault-name kv-asaf-arca --name SMTP-REMETENTE --query value -o tsv)
          echo "::add-mask::$SMTP_HOST"
          echo "::add-mask::$SMTP_PORTA"
          echo "::add-mask::$SMTP_USUARIO"
          echo "::add-mask::$SMTP_SENHA"
          echo "::add-mask::$SMTP_REMETENTE"
          echo "SMTP_HOST=$SMTP_HOST" >> "$GITHUB_ENV"
          echo "SMTP_PORTA=$SMTP_PORTA" >> "$GITHUB_ENV"
          echo "SMTP_USUARIO=$SMTP_USUARIO" >> "$GITHUB_ENV"
          echo "SMTP_SENHA=$SMTP_SENHA" >> "$GITHUB_ENV"
          echo "SMTP_REMETENTE=$SMTP_REMETENTE" >> "$GITHUB_ENV"

      - name: Enviar os lembretes de mensalidade do dia
        run: PYTHONPATH=. python scripts/enviar_lembretes_de_mensalidade.py

      - name: Logout
        if: always()
        run: az logout || true
