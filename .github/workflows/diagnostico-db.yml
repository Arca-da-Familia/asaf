name: Diagnóstico do banco (só leitura)

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Login no Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Buscar DATABASE_URL do Key Vault
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      # v3.0 - reparo pontual do drift entre alembic_version (travado em f2a3b4c5d6e7, v2.1) e o
      # schema real de produção: `assembleias` é tabela órfã do protótipo pré-Alembic (baseline
      # bba8fd2aebda, formato incompatível com o modelo atual, 0 linhas - mesma classe de
      # problema do financeiro v0.1) e bloqueia o CREATE TABLE de v2.2. As outras 19 tabelas de
      # v2.2-v2.9 genuinamente não existem ainda. Nenhuma tabela envolvida tem dado real
      # (confirmado no diagnóstico anterior). Passo único, não deve rodar de novo depois de
      # aplicado - arquivo removido do repositório logo em seguida.
      - name: Checar dependentes órfãos de assembleias (só leitura)
        run: |
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              for t in ["assembleias", "documentos_institucionais", "registros_votos"]:
                  n = conn.execute(text(f'SELECT COUNT(*) FROM "{t}"')).scalar()
                  print(f"{t}: {n} linha(s)")
          EOF

      - name: Reparar drift do Alembic (v2.2-v2.9) e aplicar v3.0
        run: |
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])

          # v3.0 - achado ao tentar o DROP simples: `documentos_institucionais` e
          # `registros_votos` têm FK pra `assembleias` e são, elas próprias, órfãs do mesmo
          # protótipo pré-Alembic (DocumentoInstitucional/RegistroVoto - nomes que só existem
          # hoje como comentário histórico no PLANO_PROJETO.md, nenhum model/router atual usa
          # essas tabelas - confirmado por grep antes deste passo). Cai tudo junto.
          with engine.begin() as conn:
              for t in ["assembleias", "documentos_institucionais", "registros_votos"]:
                  linhas = conn.execute(text(f'SELECT COUNT(*) FROM "{t}"')).scalar()
                  assert linhas == 0, f"{t} tem {linhas} linha(s) - abortando, não é o cenário esperado"
              conn.execute(text('DROP TABLE documentos_institucionais, registros_votos, assembleias'))
              print("assembleias e órfãs dependentes (protótipo pré-Alembic) removidas.")

          from app.database import Base
          import app.models  # garante que todos os modelos estão registrados em Base.metadata

          tabelas_v2_2_a_v2_9 = [
              "assembleias", "habilitados_assembleia", "peticoes_convocacao", "adesoes_peticao",
              "credenciamentos_assembleia", "itens_pauta", "ocorrencias_sessao",
              "votacoes", "votos_abertos", "comprovantes_voto_secreto", "registros_voto_secreto", "impugnacoes_votacao",
              "atas", "deliberacoes", "certidoes_deliberacao",
              "pareceres_prestacao_contas", "questionamentos_lancamento", "respostas_questionamento",
              "processos_disciplinares", "manifestacoes_diretoria_disciplinar",
              "processos_dissolucao",
              "eventos_calendario",
          ]
          tabelas = [Base.metadata.tables[nome] for nome in tabelas_v2_2_a_v2_9]
          Base.metadata.create_all(bind=engine, checkfirst=True, tables=tabelas)
          print(f"{len(tabelas)} tabelas de v2.2-v2.9 confirmadas/criadas.")
          EOF

      - name: alembic stamp b0c1d2e3f4a5 (v2.9 - alinha ponteiro à realidade do schema)
        run: alembic stamp b0c1d2e3f4a5

      - name: alembic upgrade head (aplica a v3.0 de verdade)
        run: alembic upgrade head

      - name: Confirmar estado final
        run: alembic current -v

      - name: Logout
        if: always()
        run: az logout || true
