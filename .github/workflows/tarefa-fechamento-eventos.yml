name: Tarefa Periódica (fecha financeiramente eventos encerrados)

# v4.9 (FASE 4) - todo evento com data de encerramento no passado e ainda sem `FechamentoEvento`
# ganha um automaticamente (inscritos, presentes, arrecadado, custos, resultado por centro de
# custo) - "fechamento financeiro automático ao encerrar" só acontece de verdade em produção se
# alguém checar isso periodicamente. Roda como SISTEMA, mesmo mecanismo de confiança que já roda
# migração Alembic e as demais tarefas periódicas em produção.
on:
  schedule:
    - cron: "0 6 * * *" # uma vez por dia, 06:00 UTC
  workflow_dispatch: {}

permissions:
  id-token: write # necessário para login OIDC no Azure (sem senha salva)
  contents: read

jobs:
  fechar-eventos-encerrados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Login no Azure via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # v9.2 (autorizado pelo Presidente em 2026-11-04): o banco aceita os "serviços do Azure", e a máquina do GitHub às vezes sai por um endereço fora dessa
      # faixa (3 publicações falharam assim em 03 e 04/11). Abre o banco SÓ para o IP desta máquina, durante este trabalho; o passo "Fechar o banco"
      # apaga a regra no fim, também quando algo falha. O banco continua exigindo senha e conexão cifrada. Teste: tests/test_regra_temporaria_do_banco.py.
      - name: Abrir o banco só para esta máquina (regra temporária)
        run: |
          IP=""
          for servico in https://api.ipify.org https://ifconfig.me/ip https://icanhazip.com; do
            IP=$(curl -fsS --max-time 10 "$servico" 2>/dev/null | tr -d '[:space:]') || true
            if [[ "$IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then break; fi
            IP=""
          done
          # se não der para abrir, AVISA e segue como antes (a conexão pode passar pela regra dos serviços do Azure): nunca trava a rotina por causa disto
          if [ -z "$IP" ]; then echo "::warning::Não deu para saber o IP desta máquina: segue sem a regra temporária."; exit 0; fi
          NOME="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if ! az postgres flexible-server firewall-rule create --resource-group Associacao-RG --server-name asaf-pg-server --name "$NOME" \
              --start-ip-address "$IP" --end-ip-address "$IP" -o none; then
            echo "::warning::Não deu para criar a regra temporária do banco: segue sem ela."; exit 0
          fi
          echo "REGRA_TEMPORARIA_DO_BANCO=$NOME" >> "$GITHUB_ENV"
          echo "Banco aberto só para esta máquina (regra $NOME)."

      - name: Buscar DATABASE_URL do Key Vault
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          # v7.3d: a senha também SOZINHA (e como fica depois de decodificada) - o mascaramento só pega o texto exato, e uma mensagem de erro pode trazer
          # só a senha. O registro seguro (app/registro_seguro.py) tira a mensagem dos erros: os registros deste repositório são públicos.
          DB_SENHA=$(python3 -c "from urllib.parse import urlsplit, unquote; import sys; s = urlsplit(sys.argv[1]).password or ''; print(s); print(unquote(s))" "$DB_URL")
          while IFS= read -r PARTE; do if [ -n "$PARTE" ]; then echo "::add-mask::$PARTE"; fi; done <<< "$DB_SENHA"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "ASAF_REGISTRO_SEGURO=1" >> "$GITHUB_ENV"

      - name: Rodar fechamento de eventos encerrados
        run: PYTHONPATH=. python scripts/fechar_eventos_encerrados.py

      - name: Fechar o banco para esta máquina (apaga a regra temporária)
        if: always()
        run: |
          if [ -z "${REGRA_TEMPORARIA_DO_BANCO:-}" ]; then echo "Nenhuma regra temporária para apagar."; exit 0; fi
          case "$REGRA_TEMPORARIA_DO_BANCO" in
            github-*) ;;
            *) echo "::error::Recusado: só apago regra temporária (github-*), não '$REGRA_TEMPORARIA_DO_BANCO'."; exit 1 ;;
          esac
          az postgres flexible-server firewall-rule delete --resource-group Associacao-RG --server-name asaf-pg-server \
            --name "$REGRA_TEMPORARIA_DO_BANCO" --yes -o none
          echo "Regra temporária $REGRA_TEMPORARIA_DO_BANCO apagada."

      - name: Logout
        if: always()
        run: az logout || true
