name: Validar em Postgres (schema + migração de índices + suíte)

# Por que existe (achado de 2026-10-02, Lote 3): a suíte padrão roda em SQLite, mas a produção é Postgres.
# O SQLAlchemy 2.1 trocou o driver padrão de `postgresql://` e tudo passou verde em SQLite enquanto a API
# quase não subia em produção. Este workflow sobe um Postgres descartável, cria o schema do app, testa a
# migração que corrige o banco de produção (que NÃO tem alguns índices dos modelos) e roda a suíte inteira
# contra ele - nunca toca em produção e NÃO faz deploy.
#
# A matriz compara a versão do Postgres de produção com a seguinte, para provar o app na versão nova ANTES
# de atualizar o servidor (Lote 4: PostgreSQL 16 -> 18).
on:
  workflow_dispatch: {}
  push:
    branches: ["validar/**"]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asaf_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # `postgresql://` PURO de propósito: é o formato do segredo de produção e exercita app/url_banco.py.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asaf_teste
      ASAF_TESTE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asaf_teste
      RUN_DB_MIGRATION: "false"
      JWT_SECRET: segredo-de-teste-pytest-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          pip list | grep -iE "^(sqlalchemy|alembic|psycopg|psycopg-binary|reportlab|qrcode|starlette|fastapi) "
      - name: Versão do Postgres no serviço
        run: python -c "import app.database as d; from sqlalchemy import text; print(d.engine.connect().execute(text('select version()')).scalar())"
      # O histórico do Alembic NÃO recria o banco do zero: a 1ª migração é "baseline: schema existente"
      # (vazia) e as demais evoluem um schema que já nasceu do create_all do app. Então o schema do teste
      # nasce igual ao de dev (preparar_banco) e é carimbado no head.
      - name: Criar o schema como o app cria (preparar_banco) e carimbar no head
        run: |
          python -c "import app.models; from app.database import preparar_banco; preparar_banco()"
          alembic stamp head
          alembic heads
          alembic current
      - name: Modelos x banco (alembic check) - tem que estar LIMPO
        run: alembic check
      # Simula o banco de PRODUÇÃO antes da migração dos índices (ele não tem estes 7 índices) e prova que
      # a migração os cria e deixa o `alembic check` limpo; depois repete (idempotência) e desfaz/refaz.
      - name: Migração dos índices sobre um schema no formato da produção
        run: |
          python - <<'EOF'
          from sqlalchemy import text
          from app.database import engine
          indices = ["ix_aprovacoes_compra_id_solicitacao", "ix_associados_id_pessoa", "ix_cotacoes_compra_id_solicitacao",
                     "ix_dados_bancarios_fornecedor_id_fornecedor", "ix_dependentes_familiares_id_pessoa_titular",
                     "ix_dependentes_familiares_id_pessoa_vinculada", "ix_opcoes_catalogo_codigo"]
          with engine.begin() as c:
              for i in indices:
                  c.execute(text(f"DROP INDEX {i}"))
              c.execute(text("UPDATE alembic_version SET version_num = '85a120a27eb7'"))
          print("schema no formato da producao: 7 indices removidos, versao 85a120a27eb7")
          EOF
          if alembic check; then echo "ERRO: o alembic check devia acusar a falta dos índices"; exit 1; fi
          alembic upgrade head
          alembic check
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Suíte completa contra Postgres
        run: python -m pytest tests/ -q -p no:warnings
