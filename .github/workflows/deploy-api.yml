name: Deploy API (FastAPI)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Dockerfile"
      - "templates/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # necessário para login OIDC no Azure (sem senha salva)
  contents: read

env:
  RESOURCE_GROUP: Associacao-RG
  REGISTRY: asafregistry
  IMAGE_NAME: asaf-api
  CONTAINER_APP: asaf-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Postgres 16 DESCARTÁVEL só para a suíte (nunca toca em produção). A suíte rodava só em SQLite, que não
    # impõe chave estrangeira nem ordem de DDL; ao rodar num Postgres de verdade (Lote 3, 2026-10-02) saíram
    # 4 defeitos antigos e a troca de driver padrão do SQLAlchemy 2.1 - tudo invisível em SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asaf_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # O histórico do Alembic NÃO recria o banco do zero (a 1ª migração é "baseline: schema existente",
      # vazia): o schema de teste nasce como o do app (preparar_banco) e é carimbado no head. O
      # `alembic check` tem que sair LIMPO - trava modelo que o Alembic não enxerga. `postgresql://` PURO de
      # propósito: é o formato do segredo de produção e exercita app/url_banco.py (SQLAlchemy 2.1 mudou o
      # driver padrão desse formato para psycopg 3).
      - name: Criar o schema de teste num Postgres descartável e conferir o Alembic
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asaf_teste
          RUN_DB_MIGRATION: "false"
          JWT_SECRET: segredo-de-teste-pytest-nao-usar-em-producao
        run: |
          python -c "import app.models; from app.database import preparar_banco; preparar_banco()"
          alembic stamp head
          alembic check

      - name: Rodar testes automatizados contra Postgres (achado do Ponto de Revisão FASE 0/v0.3)
        # tests/conftest.py usa ASAF_TESTE_DATABASE_URL quando existe (aqui: o Postgres descartável acima;
        # sem ela, SQLite descartável) - nunca depende do ambiente de produção. `python -m pytest`
        # (não só `pytest`) é necessário para o diretório do repo entrar no sys.path - senão
        # `from app.main import app` em conftest.py falha com ModuleNotFoundError no runner.
        env:
          ASAF_TESTE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asaf_teste
          RUN_DB_MIGRATION: "false"
        run: python -m pytest tests/ -v

      - name: Login no Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Buscar DATABASE_URL do Key Vault
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Aplicar migrações Alembic em produção
        run: alembic upgrade head

      - name: Build da imagem no ACR (sem precisar de Docker no runner)
        run: |
          az acr build \
            --registry ${{ env.REGISTRY }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Atualiza o Container App com a nova imagem
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Logout
        if: always()
        run: az logout || true
