name: Deploy API (FastAPI)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Dockerfile"
      - "templates/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # necessário para login OIDC no Azure (sem senha salva)
  contents: read

env:
  RESOURCE_GROUP: Associacao-RG
  REGISTRY: asafregistry
  IMAGE_NAME: asaf-api
  CONTAINER_APP: asaf-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes automatizados (achado do Ponto de Revisão FASE 0/v0.3)
        # tests/conftest.py já define seu próprio DATABASE_URL/JWT_SECRET (sqlite descartável
        # dedicado a teste) - não depende de nada do ambiente de produção. `python -m pytest`
        # (não só `pytest`) é necessário para o diretório do repo entrar no sys.path - senão
        # `from app.main import app` em conftest.py falha com ModuleNotFoundError no runner.
        run: python -m pytest tests/ -v

      - name: Login no Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Buscar DATABASE_URL do Key Vault
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Aplicar migrações Alembic em produção
        run: alembic upgrade head

      - name: Build da imagem no ACR (sem precisar de Docker no runner)
        run: |
          az acr build \
            --registry ${{ env.REGISTRY }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Atualiza o Container App com a nova imagem
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Logout
        if: always()
        run: az logout || true
