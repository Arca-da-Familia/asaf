name: Deploy API (FastAPI)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Dockerfile"
      - "templates/**"
      - "infra/config/api-producao*.env" # v8.5: a configuração versionada (v8.3) também publica - antes, mudá-la sozinha não chegava à produção
      - "infra/aplicar_sondas.py"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # necessário para login OIDC no Azure (sem senha salva)
  contents: read

env:
  RESOURCE_GROUP: Associacao-RG
  REGISTRY: asafregistry
  IMAGE_NAME: asaf-api
  CONTAINER_APP: asaf-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Postgres 18 DESCARTÁVEL (a MESMA versão major da produção: servidor atualizado de 16 para 18 em
    # 2026-10-02, Lote 4) só para a suíte (nunca toca em produção). A suíte rodava só em SQLite, que não
    # impõe chave estrangeira nem ordem de DDL; ao rodar num Postgres de verdade (Lote 3, 2026-10-02) saíram
    # 4 defeitos antigos e a troca de driver padrão do SQLAlchemy 2.1 - tudo invisível em SQLite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asaf_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # O histórico do Alembic NÃO recria o banco do zero (a 1ª migração é "baseline: schema existente",
      # vazia): o schema de teste nasce como o do app (preparar_banco) e é carimbado no head. O
      # `alembic check` tem que sair LIMPO - trava modelo que o Alembic não enxerga. `postgresql://` PURO de
      # propósito: é o formato do segredo de produção e exercita app/url_banco.py (SQLAlchemy 2.1 mudou o
      # driver padrão desse formato para psycopg 3).
      - name: Criar o schema de teste num Postgres descartável e conferir o Alembic
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asaf_teste
          RUN_DB_MIGRATION: "false"
          JWT_SECRET: segredo-de-teste-pytest-nao-usar-em-producao
        run: |
          python -c "import app.models; from app.database import preparar_banco; preparar_banco()"
          alembic stamp head
          alembic check

      - name: Rodar testes automatizados contra Postgres (achado do Ponto de Revisão FASE 0/v0.3)
        # tests/conftest.py usa ASAF_TESTE_DATABASE_URL quando existe (aqui: o Postgres descartável acima;
        # sem ela, SQLite descartável) - nunca depende do ambiente de produção. `python -m pytest`
        # (não só `pytest`) é necessário para o diretório do repo entrar no sys.path - senão
        # `from app.main import app` em conftest.py falha com ModuleNotFoundError no runner.
        env:
          ASAF_TESTE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asaf_teste
          RUN_DB_MIGRATION: "false"
        run: python -m pytest tests/ -v

      - name: Login no Azure via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # v9.2 (autorizado pelo Presidente em 2026-11-04): o banco aceita os "serviços do Azure", e a máquina do GitHub às vezes sai por um endereço fora dessa
      # faixa (3 publicações falharam assim em 03 e 04/11). Abre o banco SÓ para o IP desta máquina, durante este trabalho; o passo "Fechar o banco"
      # apaga a regra no fim, também quando algo falha. O banco continua exigindo senha e conexão cifrada. Teste: tests/test_regra_temporaria_do_banco.py.
      - name: Abrir o banco só para esta máquina (regra temporária)
        run: |
          IP=""
          for servico in https://api.ipify.org https://ifconfig.me/ip https://icanhazip.com; do
            IP=$(curl -fsS --max-time 10 "$servico" 2>/dev/null | tr -d '[:space:]') || true
            if [[ "$IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then break; fi
            IP=""
          done
          # se não der para abrir, AVISA e segue como antes (a conexão pode passar pela regra dos serviços do Azure): nunca trava a rotina por causa disto
          if [ -z "$IP" ]; then echo "::warning::Não deu para saber o IP desta máquina: segue sem a regra temporária."; exit 0; fi
          NOME="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if ! az postgres flexible-server firewall-rule create --resource-group Associacao-RG --name asaf-pg-server --rule-name "$NOME" \
              --start-ip-address "$IP" --end-ip-address "$IP" -o none; then
            echo "::warning::Não deu para criar a regra temporária do banco: segue sem ela."; exit 0
          fi
          echo "REGRA_TEMPORARIA_DO_BANCO=$NOME" >> "$GITHUB_ENV"
          echo "Banco aberto só para esta máquina (regra $NOME)."

      - name: Buscar DATABASE_URL do Key Vault
        run: |
          DB_URL=$(az keyvault secret show --vault-name kv-asaf-arca --name DATABASE-URL --query value -o tsv)
          echo "::add-mask::$DB_URL"
          # v7.3d: a senha também SOZINHA (e como fica depois de decodificada) - o mascaramento só pega o texto exato, e uma mensagem de erro pode trazer
          # só a senha. O registro seguro (app/registro_seguro.py) tira a mensagem dos erros: os registros deste repositório são públicos.
          DB_SENHA=$(python3 -c "from urllib.parse import urlsplit, unquote; import sys; s = urlsplit(sys.argv[1]).password or ''; print(s); print(unquote(s))" "$DB_URL")
          while IFS= read -r PARTE; do if [ -n "$PARTE" ]; then echo "::add-mask::$PARTE"; fi; done <<< "$DB_SENHA"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "ASAF_REGISTRO_SEGURO=1" >> "$GITHUB_ENV"

      - name: Aplicar migrações Alembic em produção
        # O banco às vezes não aceita a conexão da máquina do GitHub a tempo ("connection timeout": 2 vezes em 03 e 04/11, banco no ar o tempo todo, nenhuma
        # conexão recusada). Tenta até 3 vezes, 30 s entre elas; se a migração falhar de verdade, para na 3ª (a migração no Postgres é transacional: uma
        # tentativa que caiu não deixa nada pela metade).
        run: |
          for TENTATIVA in 1 2 3; do
            if alembic upgrade head; then exit 0; fi
            echo "::warning::A migração não rodou (tentativa $TENTATIVA de 3)."
            if [ "$TENTATIVA" -lt 3 ]; then sleep "${ESPERA_ENTRE_TENTATIVAS:-30}"; fi
          done
          exit 1

      - name: Build da imagem no ACR (sem precisar de Docker no runner)
        run: |
          az acr build \
            --registry ${{ env.REGISTRY }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      # v8.3: a configuração que não é segredo e o tamanho vêm de infra/config/ (versionados); os segredos continuam no cofre, por referência
      - name: Atualiza o Container App com a nova imagem
        run: |
          CONFIG="${GITHUB_WORKSPACE:-.}/infra/config"
          VARIAVEIS=$(grep -Ev '^\s*(#|$)' "$CONFIG/api-producao.env" | tr '\n' ' ')
          . "$CONFIG/api-producao-escala.env"
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars $VARIAVEIS \
            --max-replicas "$MAX_REPLICAS" --cpu "$CPU" --memory "$MEMORIA" \
            -o none

      # v8.4a: as sondas de partida, vida e prontidão (/health/live e /health/ready); só troca as sondas, e só se mudaram
      - name: Liga as sondas do Container App
        run: python infra/aplicar_sondas.py "${{ env.RESOURCE_GROUP }}" "${{ env.CONTAINER_APP }}"

      - name: Fechar o banco para esta máquina (apaga a regra temporária)
        if: always()
        run: |
          if [ -z "${REGRA_TEMPORARIA_DO_BANCO:-}" ]; then echo "Nenhuma regra temporária para apagar."; exit 0; fi
          case "$REGRA_TEMPORARIA_DO_BANCO" in
            github-*) ;;
            *) echo "::error::Recusado: só apago regra temporária (github-*), não '$REGRA_TEMPORARIA_DO_BANCO'."; exit 1 ;;
          esac
          az postgres flexible-server firewall-rule delete --resource-group Associacao-RG --name asaf-pg-server \
            --rule-name "$REGRA_TEMPORARIA_DO_BANCO" --yes -o none
          echo "Regra temporária $REGRA_TEMPORARIA_DO_BANCO apagada."

      - name: Logout
        if: always()
        run: az logout || true
