<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP ASAF - Portal de Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="max-w-4xl w-full mx-auto p-6">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">ASAF</h1>
            <p class="text-lg text-slate-600">Associação Arca da Família</p>
            <div class="h-1 w-20 bg-blue-600 mx-auto mt-4 rounded"></div>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Card: Portal do Associado -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center hover:shadow-md transition-shadow duration-300">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-3">Portal do Associado</h2>
                <p class="text-slate-500 mb-8 text-sm">Acesse sua carteirinha digital, vote em assembleias e consulte seus débitos.</p>
                <!-- AQUI ESTÁ A CORREÇÃO DO LINK -->
                <a href="/meu-portal/1" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 text-center">
                    Entrar como Membro
                </a>
            </div>

            <!-- Card: Secretaria e Governança -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center hover:shadow-md transition-shadow duration-300">
                <div class="w-16 h-16 bg-slate-100 text-slate-700 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-3">Secretaria e Governança</h2>
                <p class="text-slate-500 mb-8 text-sm">Painel exclusivo para a Diretoria, Conselho Fiscal e Gestão de Projetos.</p>
                <a href="/admin" class=" class="block w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 text-center">
                    Acesso Administrativo
                </a>
            </div>
        </div>
    </div>
</body>
</html>
