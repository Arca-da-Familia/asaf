<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícones gerados da logo institucional (design/logo/, via `npm run logos` em site/) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#145238" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASAF · Painel</title>
    <script>
      // Aplica o tema antes do React carregar (evita "piscar" da tela errada no F5).
      ;(function () {
        try {
          var t = localStorage.getItem('asaf-tema') || 'sistema'
          var dark =
            t === 'escuro' ||
            (t === 'sistema' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
